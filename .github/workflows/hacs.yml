name: HACS

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * 0"
  # 手动重跑：改过仓库描述/topics 等元数据后，不必再等一周或空提交
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate the repository for HACS
    # hacs/action 只校验 public 仓库；仓库转公开后这个 job 会自动开始执行。
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration
