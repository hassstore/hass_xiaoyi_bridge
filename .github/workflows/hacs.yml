name: HACS

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * 0"
  # 手动重跑：改过仓库描述/topics 等元数据后，不必再等一周或空提交
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    name: Validate the repository for HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration
